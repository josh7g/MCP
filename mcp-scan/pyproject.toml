[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-scan"
version = "0.1.0"
description = "Static security scanner and runtime guard for MCP tool metadata (prompt-injection / tool-poisoning defense)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Joshua Nketsiah" }]
keywords = ["mcp", "prompt-injection", "llm-security", "ai-security", "agents", "tool-poisoning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.9"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "mcp>=1.9"]

[project.scripts]
mcp-scan = "mcp_scan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/mcp_scan/fixtures.py" = ["E501"]
